<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Analyst Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#07130d);--ink:light-dark(#0b0b10,#e9f3ee);--mute:light-dark(#55575e,#9fb3a9);--line:light-dark(#e3e5e8,#1d2e26);--green:#00a862;--mist:light-dark(#eafaf2,#0d2219);--card:light-dark(#ffffff,#0b1a13);--warn:light-dark(#fff6c2,#3a3200);--err:light-dark(#b42318,#ff8a80)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;font-weight:500;letter-spacing:-.02em;line-height:1.1;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid var(--line);background:transparent;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.go{background:var(--green);color:#fff;border-color:var(--green)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
textarea{min-height:90px;resize:vertical;line-height:1.45}
label{font-size:14px;font-weight:600;display:block;margin:0 0 6px}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
.err{color:var(--err);font-size:14px}
/* lock screen */
#lock{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--green)}
.lockcard{background:var(--card);border-radius:14px;padding:28px;width:min(440px,100%);display:grid;gap:14px}
.lockcard h1{font-size:34px}
/* app */
#app{display:none;min-height:100%}
.top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:16px max(3vw,16px);border-bottom:1px solid var(--line)}
.top h1{font-size:28px}
.top .who{color:var(--mute);font-size:14px}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);min-height:calc(100% - 77px)}
aside{border-right:1px solid var(--line);padding:16px max(2vw,16px);display:grid;align-content:start;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tlist{display:grid}
.tgroup{font:600 12px Inter,sans-serif;color:var(--mute);margin:14px 0 4px}
.titem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:9px 10px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.titem:hover{background:var(--mist)}
.titem[aria-current=true]{background:var(--ink);color:var(--bg)}
.titem small{font-size:12px;opacity:.75;white-space:nowrap}
main{padding:22px max(3vw,16px) 60px;display:grid;align-content:start;gap:18px;max-width:1100px}
.head h2{font-size:clamp(28px,3.4vw,40px)}
.head p{margin:8px 0 0;color:var(--mute);max-width:70ch}
.form{display:grid;gap:12px;padding:18px;border:1px solid var(--line);border-radius:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.log{font-size:14px;color:var(--mute);background:var(--mist);border-radius:10px;padding:12px 14px;max-height:220px;overflow:auto;display:grid;gap:3px}
.log b{color:var(--ink)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--mute);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.band{background:var(--green);color:#fff;border-radius:12px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.band b{font-size:18px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px;border-bottom:2px solid var(--ink)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td ul{margin:0;padding-left:18px}
td a{color:var(--ink)}
.code{font:600 13px Inter,sans-serif;background:var(--mist);border-radius:6px;padding:2px 7px;margin-right:6px}
.doc{border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3vw,36px);background:var(--card)}
.doc h1{font-size:30px;margin-bottom:6px}
.doc h2{font-size:21px;margin:22px 0 8px}
.doc p,.doc li{max-width:72ch}
.doc img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;margin:8px 0}
.doc .meta{font-size:13px;color:var(--mute)}
mark{background:#ffe766;color:#0b0b10;padding:0 2px;border-radius:3px;cursor:help}
.md table{margin:10px 0}
.md a{color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--mist);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.form h3{font-size:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.regions{display:flex;flex-wrap:wrap;gap:10px}
.rgroup{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px dashed var(--line);border-radius:12px}
.brand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.who b{color:var(--ink)}
td select{min-width:120px}
@media(max-width:600px){.brand{grid-template-columns:minmax(0,1fr)}}
@media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}aside{border-right:0;border-bottom:1px solid var(--line)}.tlist{max-height:46vh;overflow:auto}}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{border:0;padding:4px 0}}
</style>
</head>
<body>

<section id="lock">
  <div class="lockcard" id="lockcard"></div>
</section>

<div id="app">
  <div class="top">
    <div><h1>Analyst Hub</h1><div class="who" id="who"></div></div>
    <div class="acts">
      <button class="btn small" id="b-settings" type="button">Settings</button>
      <button class="btn small" id="b-lock" type="button">Sign out</button>
    </div>
  </div>
  <div class="layout">
    <aside>
      <div class="chips" id="chips"></div>
      <input type="text" id="q" placeholder="Search tasks" aria-label="Search tasks">
      <div class="tlist" id="tlist"></div>
      <div id="recent"></div>
    </aside>
    <main id="work"></main>
  </div>
</div>



<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/docx.iife.js"></script>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="prompts.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
